name: Security CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Trivy | Packaged Java dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven dependency cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package application and all runtime dependencies
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Reject high and critical vulnerabilities in packaged application
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: target/enterprise-payment-platform-0.1.0-SNAPSHOT.jar
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          version: v0.74.0

  secret-scan:
    name: Gitleaks | Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
