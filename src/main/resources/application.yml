spring:
  application:
    name: enterprise-payment-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${DB_USER:payment_app}
    password: ${DB_PASSWORD:localdev_only_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Use Spring Boot's built-in ECS JSON encoder (no extra logging libraries).
# Set LOG_CONSOLE_FORMAT to a supported format (ecs, logstash or gelf)
# for deployment-specific ingestion requirements.
# Every MDC correlationId is included automatically in the JSON event.
logging:
  structured:
    format:
      console: ${LOG_CONSOLE_FORMAT:ecs}
